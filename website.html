<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧬 Junior Biologist Quiz 🌱</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#2d5a27,#4a7c59,#6b9080);
    min-height:100vh;
    color:#2d5a27;
}

.container {
    max-width:800px;
    margin:auto;
    padding:20px;
}

.header {
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
    margin-bottom:20px;
}

.progress {
    display:flex;
    align-items:center;
    gap:10px;
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

.bar {
    flex:1;
    height:12px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
}

.fill {
    height:100%;
    width:0%;
    background:#4a7c59;
}

.quiz {
    background:white;
    padding:20px;
    border-radius:15px;
}

.question {
    font-size:1.2em;
    margin-bottom:15px;
}

.option {
    padding:12px;
    border:1px solid #ccc;
    margin:8px 0;
    border-radius:8px;
    cursor:pointer;
}

.option.correct { background:#2ecc71; color:white; }
.option.wrong { background:#e74c3c; color:white; }

button {
    margin-top:15px;
    padding:10px 20px;
    background:#4a7c59;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    display:none;
}

.end {
    display:none;
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🧬 Junior Biologist Quiz 🌱</h1>
</div>

<div class="progress">
<div id="plant">🌱</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="score">0/50</div>
</div>

<div class="quiz" id="quiz">
<div class="question" id="q"></div>
<div id="opts"></div>
<button id="next">Next</button>
</div>

<div class="end" id="end">
<h2>🎉 Finished!</h2>
<p id="final"></p>
<button onclick="restart()">Restart</button>
</div>

</div>

<script>

const questions = [
{q:"Basic unit of life?",o:["Cell","Atom","Tissue","Organ"],a:0},
{q:"Photosynthesis needs?",o:["Sunlight","Only soil","Only water","Oxygen only"],a:0},
{q:"Genetic material?",o:["DNA","Protein","Sugar","Fat"],a:0},
{q:"Frogs are?",o:["Mammals","Birds","Amphibians","Fish"],a:2},
{q:"Plant food process?",o:["Respiration","Photosynthesis","Digestion","Fermentation"],a:1},
{q:"Powerhouse of cell?",o:["Nucleus","Mitochondria","Ribosome","Wall"],a:1},
{q:"Humans chromosomes?",o:["23","46","44","48"],a:1},
{q:"Gas from plants?",o:["CO2","Oxygen","Nitrogen","Hydrogen"],a:1},
{q:"Prokaryotes lack?",o:["Nucleus","Membrane","Cytoplasm","Wall"],a:0},
{q:"Birds are?",o:["Warm blooded","Cold blooded","Fish","Insects"],a:0},

{q:"Heart function?",o:["Pump blood","Digest food","Think","Breathe"],a:0},
{q:"Respiration organ?",o:["Lungs","Heart","Liver","Skin"],a:0},
{q:"Green pigment?",o:["Chlorophyll","Hemoglobin","Melanin","Keratin"],a:0},
{q:"DNA is found in?",o:["Nucleus","Wall","Vacuole","Skin"],a:0},
{q:"Plants are?",o:["Autotrophs","Heterotrophs","Consumers","Parasites"],a:0},

{q:"Bones system?",o:["Skeletal","Digestive","Nervous","Muscular"],a:0},
{q:"Fish breathe with?",o:["Gills","Lungs","Skin","Mouth"],a:0},
{q:"Biologist studies?",o:["Life","Rocks","Stars","Machines"],a:0},
{q:"Cell membrane controls?",o:["Entry/exit","DNA","Heat","Bones"],a:0},
{q:"Photosynthesis happens in?",o:["Chloroplast","Mitochondria","Nucleus","Wall"],a:0},

{q:"Ribosomes make?",o:["Protein","Fat","Sugar","Water"],a:0},
{q:"Bacteria are?",o:["Prokaryotic","Eukaryotic","Plants","Animals"],a:0},
{q:"Virus is?",o:["Non-living","Plant","Animal","Cell"],a:0},
{q:"Diffusion is?",o:["Particle movement","Growth","Division","Eating"],a:0},
{q:"Osmosis is movement of?",o:["Water","Sugar","Protein","DNA"],a:0},

{q:"Xylem carries?",o:["Water","Food","Gas","Heat"],a:0},
{q:"Phloem carries?",o:["Food","Water","Oxygen","Waste"],a:0},
{q:"Reflex controlled by?",o:["Spinal cord","Heart","Liver","Eye"],a:0},
{q:"Mutation affects?",o:["Genes","Bones","Skin","Organs"],a:0},
{q:"Enzymes are?",o:["Proteins","Fats","Sugars","Minerals"],a:0},

{q:"Homeostasis means?",o:["Balance","Growth","Breakdown","Movement"],a:0},
{q:"Scientific method starts with?",o:["Observation","Conclusion","Result","Theory"],a:0},
{q:"Asexual reproduction gives?",o:["Identical offspring","Different","None","Random"],a:0},
{q:"Classification starts with?",o:["Kingdom","Species","Cell","Organ"],a:0},
{q:"Humans belong to?",o:["Animals","Plants","Fungi","Bacteria"],a:0},

{q:"Chloroplast contains?",o:["Chlorophyll","DNA","Protein","Fat"],a:0},
{q:"Blood is pumped by?",o:["Heart","Brain","Lungs","Skin"],a:0},
{q:"Warm blooded animals?",o:["Maintain temp","Cold","Sleep","Hunt only"],a:0},
{q:"Leaves mainly do?",o:["Photosynthesis","Digestion","Breathing","Movement"],a:0},
{q:"Plants absorb CO2?",o:["Yes","No","Sometimes","Never"],a:0},

{q:"Cells come from?",o:["Other cells","Air","Soil","Light"],a:0},
{q:"Tissues form?",o:["Organs","Cells","Atoms","Planets"],a:0},
{q:"Organs form?",o:["Systems","Cells","Atoms","DNA"],a:0},
{q:"System example?",o:["Digestive","Atom","Cell","Gas"],a:0},
{q:"Science of life?",o:["Biology","Physics","Math","Chemistry"],a:0}
];

let i=0, score=0, locked=false;

function load(){
locked=false;
document.getElementById("next").style.display="none";

let q=questions[i];
document.getElementById("q").textContent=q.q;

let box=document.getElementById("opts");
box.innerHTML="";

q.o.forEach((opt,idx)=>{
let d=document.createElement("div");
d.className="option";
d.textContent=opt;

d.onclick=()=>{
if(locked) return;
locked=true;

document.querySelectorAll(".option").forEach((el,j)=>{
if(j===q.a) el.classList.add("correct");
else if(j===idx) el.classList.add("wrong");
});

if(idx===q.a) score++;

document.getElementById("next").style.display="block";
document.getElementById("score").textContent=`${score}/50`;
};

box.appendChild(d);
});

document.getElementById("fill").style.width=(i/50)*100+"%";
}

document.getElementById("next").onclick=()=>{
i++;
if(i>=questions.length){
document.getElementById("quiz").style.display="none";
document.getElementById("end").style.display="block";
document.getElementById("final").textContent=`Score: ${score}/50`;
return;
}
load();
};

function restart(){
i=0; score=0;
document.getElementById("quiz").style.display="block";
document.getElementById("end").style.display="none";
load();
}

load();
</script>

</body>
</html>
