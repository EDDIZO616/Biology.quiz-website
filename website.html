<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧬 Junior Biologist Quiz 🌱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d5a27 0%, #4a7c59 50%, #6b9080 100%);
            min-height: 100vh;
            color: #2d5a27;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating microscopic cells animation */
        .floating-cells {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .cell {
            position: absolute;
            font-size: 20px;
            animation: float 15s infinite linear;
            opacity: 0.3;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
            }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #2d5a27;
        }

        .progress-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
        }

        .plant-progress {
            font-size: 3em;
            transition: all 0.5s ease;
        }

        .progress-bar {
            flex: 1;
            height: 20px;
            background: #e0f2e7;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a7c59, #6b9080);
            border-radius: 10px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .difficulty-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .difficulty-btn {
            padding: 15px 25px;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            color: #2d5a27;
        }

        .difficulty-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .difficulty-btn.active {
            background: #4a7c59;
            color: white;
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            display: none;
        }

        .quiz-card.active {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question {
            font-size: 1.3em;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #2d5a27;
        }

        .options {
            display: grid;
            gap: 15px;
            margin-bottom: 25px;
        }

        .option {
            padding: 15px 20px;
            border: 2px solid #e0f2e7;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8fdf9;
            font-size: 1.1em;
        }

        .option:hover {
            border-color: #4a7c59;
            background: #e0f2e7;
            transform: translateX(5px);
        }

        .option.selected {
            border-color: #4a7c59;
            background: #4a7c59;
            color: white;
        }

        .option.correct {
            border-color: #28a745;
            background: #28a745;
            color: white;
        }

        .option.incorrect {
            border-color: #dc3545;
            background: #dc3545;
            color: white;
        }

        .next-btn {
            padding: 15px 30px;
            background: #4a7c59;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .next-btn:hover {
            background: #2d5a27;
            transform: translateY(-2px);
        }

        .completion-screen {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            display: none;
            position: relative;
            overflow: hidden;
        }

        .completion-screen.active {
            display: block;
            animation: celebrationPop 0.8s ease;
        }

        @keyframes celebrationPop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .badge {
            font-size: 4em;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
            animation: badgeGlow 2s ease-in-out infinite alternate;
        }

        @keyframes badgeGlow {
            from {
                box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
            }
            to {
                box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
            }
        }

        .floating-leaves {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .leaf {
            position: absolute;
            font-size: 30px;
            animation: leafFall 3s ease-in-out infinite;
        }

        @keyframes leafFall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(400px) rotate(360deg);
                opacity: 0;
            }
        }

        .restart-btn {
            padding: 15px 30px;
            background: #6b9080;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .restart-btn:hover {
            background: #4a7c59;
            transform: translateY(-2px);
        }

        .score-display {
            font-size: 1.5em;
            margin: 20px 0;
            color: #2d5a27;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .difficulty-selector {
                flex-direction: column;
                align-items: center;
            }
            
            .plant-progress {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <!-- Floating microscopic cells background -->
    <div class="floating-cells" id="floatingCells"></div>

    <div class="container">
        <div class="header">
            <h1>🧬 Junior Biologist Quiz 🌱</h1>
            <p>Test your knowledge of biology and watch your plant grow! 🔬</p>
        </div>

        <div class="progress-container">
            <div class="plant-progress" id="plantProgress">🌱</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div id="scoreDisplay">0/0</div>
        </div>

        <div class="difficulty-selector" id="difficultySelector">
            <button class="difficulty-btn active" data-level="easy">🌱 Easy</button>
            <button class="difficulty-btn" data-level="medium">🌿 Medium</button>
            <button class="difficulty-btn" data-level="hard">🌳 Hard</button>
        </div>

        <div class="quiz-card active" id="quizCard">
            <div class="question" id="question"></div>
            <div class="options" id="options"></div>
            <button class="next-btn" id="nextBtn">Next Question 🔬</button>
        </div>

        <div class="completion-screen" id="completionScreen">
            <div class="floating-leaves" id="floatingLeaves"></div>
            <h2>🎉 Congratulations! 🎉</h2>
            <div class="badge">🔬🧪🧬</div>
            <h3>Junior Biologist Badge Earned!</h3>
            <div class="score-display" id="finalScore"></div>
            <p>You've mastered the basics of biology! Keep exploring the amazing world of science! 🌟</p>
            <button class="restart-btn" id="restartBtn">Take Quiz Again 🔄</button>
        </div>
    </div>

    <script>
        const questions = {
            easy: [
                {
                    question: "🦠 What is the basic unit of life?",
                    options: ["Cell", "Atom", "Molecule", "Tissue"],
                    correct: 0
                },
                {
                    question: "🌱 What do plants need to make their own food?",
                    options: ["Only water", "Sunlight, water, and carbon dioxide", "Only sunlight", "Only soil"],
                    correct: 1
                },
                {
                    question: "🧬 What carries genetic information in living things?",
                    options: ["Protein", "Water", "DNA", "Sugar"],
                    correct: 2
                },
                {
                    question: "🐸 Which group do frogs belong to?",
                    options: ["Mammals", "Birds", "Amphibians", "Reptiles"],
                    correct: 2
                },
                {
                    question: "🌿 What process do plants use to make food from sunlight?",
                    options: ["Respiration", "Photosynthesis", "Digestion", "Circulation"],
                    correct: 1
                }
            ],
            medium: [
                {
                    question: "🦠 Which organelle is known as the 'powerhouse of the cell'?",
                    options: ["Nucleus", "Mitochondria", "Ribosome", "Vacuole"],
                    correct: 1
                },
                {
                    question: "🌱 What gas do plants release during photosynthesis?",
                    options: ["Carbon dioxide", "Nitrogen", "Oxygen", "Hydrogen"],
                    correct: 2
                },
                {
                    question: "🧫 What is the difference between prokaryotic and eukaryotic cells?",
                    options: ["Size only", "Prokaryotes lack a nucleus", "Color difference", "Shape difference"],
                    correct: 1
                },
                {
                    question: "🦅 Birds are classified as which type of animal?",
                    options: ["Cold-blooded vertebrates", "Warm-blooded vertebrates", "Invertebrates", "Amphibians"],
                    correct: 1
                },
                {
                    question: "🧬 How many chromosomes do humans typically have?",
                    options: ["23", "44", "46", "48"],
                    correct: 2
                }
            ],
            hard: [
                {
                    question: "🦠 Which structure controls what enters and exits a cell?",
                    options: ["Cell wall", "Cytoplasm", "Cell membrane", "Nucleus"],
                    correct: 2
                },
                {
                    question: "🌿 In which part of the plant cell does photosynthesis occur?",
                    options: ["Nucleus", "Mitochondria", "Chloroplasts", "Vacuole"],
                    correct: 2
                },
                {
                    question: "🧫 What is the scientific classification order from largest to smallest?",
                    options: ["Kingdom, Phylum, Class, Order, Family, Genus, Species", "Species, Genus, Family, Order, Class, Phylum, Kingdom", "Class, Order, Family, Kingdom, Phylum, Genus, Species", "Kingdom, Class, Phylum, Order, Family, Genus, Species"],
                    correct: 0
                },
                {
                    question: "🧬 What type of reproduction produces genetically identical offspring?",
                    options: ["Sexual reproduction", "Asexual reproduction", "Binary fission only", "Budding only"],
                    correct: 1
                },
                {
                    question: "🔬 What is the function of ribosomes in a cell?",
                    options: ["Energy production", "Protein synthesis", "Waste removal", "DNA storage"],
                    correct: 1
                }
            ]
        };

        let currentLevel = 'easy';
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedAnswer = null;

        // Initialize floating cells
        function createFloatingCells() {
            const container = document.getElementById('floatingCells');
            const cellEmojis = ['🦠', '🔬'];
            
            for (let i = 0; i < 15; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.textContent = cellEmojis[Math.floor(Math.random() * cellEmojis.length)];
                cell.style.left = Math.random() * 100 + '%';
                cell.style.animationDelay = Math.random() * 15 + 's';
                cell.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(cell);
            }
        }

        // Update plant progress
        function updatePlantProgress() {
            const plantElement = document.getElementById('plantProgress');
            const progressFill = document.getElementById('progressFill');
            const totalQuestions = questions[currentLevel].length;
            const progress = (currentQuestionIndex / totalQuestions) * 100;
            
            progressFill.style.width = progress + '%';
            
            if (progress < 40) {
                plantElement.textContent = '🌱';
            } else if (progress < 80) {
                plantElement.textContent = '🌿';
            } else {
                plantElement.textContent = '🌳';
            }
            
            document.getElementById('scoreDisplay').textContent = `${score}/${totalQuestions}`;
        }

        // Load current question
        function loadQuestion() {
            const questionData = questions[currentLevel][currentQuestionIndex];
            document.getElementById('question').textContent = questionData.question;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            questionData.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.textContent = option;
                optionElement.addEventListener('click', () => selectAnswer(index));
                optionsContainer.appendChild(optionElement);
            });
            
            selectedAnswer = null;
            document.getElementById('nextBtn').style.display = 'none';
            updatePlantProgress();
        }

        // Select answer
        function selectAnswer(index) {
            if (selectedAnswer !== null) return;
            
            selectedAnswer = index;
            const options = document.querySelectorAll('.option');
            const correctAnswer = questions[currentLevel][currentQuestionIndex].correct;
            
            options.forEach((option, i) => {
                if (i === correctAnswer) {
                    option.classList.add('correct');
                } else if (i === selectedAnswer && i !== correctAnswer) {
                    option.classList.add('incorrect');
                }
            });
            
            if (selectedAnswer === correctAnswer) {
                score++;
            }
            
            document.getElementById('nextBtn').style.display = 'block';
        }

        // Next question
        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex >= questions[currentLevel].length) {
                showCompletion();
            } else {
                loadQuestion();
            }
        }

        // Show completion screen
        function showCompletion() {
            document.getElementById('quizCard').classList.remove('active');
            document.getElementById('completionScreen').classList.add('active');
            
            const totalQuestions = questions[currentLevel].length;
            const percentage = Math.round((score / totalQuestions) * 100);
            document.getElementById('finalScore').textContent = `Final Score: ${score}/${totalQuestions} (${percentage}%)`;
            
            // Create floating leaves
            createFloatingLeaves();
        }

        // Create floating leaves animation
        function createFloatingLeaves() {
            const container = document.getElementById('floatingLeaves');
            container.innerHTML = '';
            
            for (let i = 0; i < 20; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf';
                leaf.textContent = '🍃';
                leaf.style.left = Math.random() * 100 + '%';
                leaf.style.animationDelay = Math.random() * 3 + 's';
                container.appendChild(leaf);
            }
        }

        // Change difficulty level
        function changeDifficulty(level) {
            currentLevel = level;
            currentQuestionIndex = 0;
            score = 0;
            
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-level="${level}"]`).classList.add('active');
            
            document.getElementById('completionScreen').classList.remove('active');
            document.getElementById('quizCard').classList.add('active');
            
            loadQuestion();
        }

        // Restart quiz
        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            
            document.getElementById('completionScreen').classList.remove('active');
            document.getElementById('quizCard').classList.add('active');
            
            loadQuestion();
        }

        // Event listeners
        document.getElementById('nextBtn').addEventListener('click', nextQuestion);
        document.getElementById('restartBtn').addEventListener('click', restartQuiz);

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                changeDifficulty(e.target.dataset.level);
            });
        });

        // Initialize
        createFloatingCells();
        loadQuestion();
    </script>

</html>
